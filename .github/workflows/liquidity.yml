name: 유동성·거시 데이터
on:
  schedule:
    - cron: '17 21 * * *'   # 매일 06:17 KST (대시보드 갱신 07:30 KST 전)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pandas numpy
      - run: python dash/liq.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      - name: 커밋
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add dash/liq_series.json dash/liq_summary.json dash/liq_log.json dash/liq_keys.json
          git diff --cached --quiet && exit 0
          git commit -m "유동성·거시 데이터 $(date -u +%F)"
          git pull --rebase -q && git push
