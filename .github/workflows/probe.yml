name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: timeout 300 python dash/probe.py || true
      - run: |
          git config user.name 'github-actions'; git config user.email 'github-actions@users.noreply.github.com'
          git add dash/probe_out.json; git commit -m probe; git pull --rebase -q && git push
