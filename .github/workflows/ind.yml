name: 산업 지표 수집
on:
  schedule:
    - cron: '5 21 * * *'   # 매일 06:05 KST (대시보드 갱신 07:30 KST 전)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - run: python ind/collect.py
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 커밋
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add dash/ind_summary.json dash/ind_series.json ind/collect_log.json
          git diff --cached --quiet && exit 0
          git commit -m "산업 지표 $(date -u +%F)"
          git pull --rebase -q && git push
